{% extends "base.html" %} {% block title %}Вхід{% endblock %} {% block content
%}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Вхід</h2>
    <form method="POST" action="{{ url_for('users.login') }}">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          id="username"
          name="username"
          required
        />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary w-100">Увійти</button>
    </form>
  </div>
</div>
{% endblock %}
